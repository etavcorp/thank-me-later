name = "thank-me-later-worker-prd"
main = "./src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = false

[vars]
APP_ENV = "local"
ALLOWED_ORIGINS = "https://thankmelatercatering.com,https://www.thankmelatercatering.com,https://uat.thankmelatercatering.com,https://thank-me-later-worker-prd.etavcorp.workers.dev"

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "thank-me-later-db-prd"
database_id = "5f67cdc8-1965-4910-b61e-52a4c976f110"

# Local development uses a true localhost-only Miniflare D1 instance.
# The special local id keeps it off Cloudflare and prevents it from appearing in d1 list.
[env.local]
name = "thank-me-later-worker-local"
workers_dev = false

[[env.local.d1_databases]]
binding = "DB"
database_name = "thank-me-later-db-local"
database_id = "local"

[env.uat]
name = "thank-me-later-worker-uat"
workers_dev = false

[env.uat.vars]
APP_ENV = "uat"
ALLOWED_ORIGINS = "https://uat.thankmelatercatering.com,https://www.uat.thankmelatercatering.com,https://thank-me-later-worker-uat.etavcorp.workers.dev"

[[env.uat.d1_databases]]
binding = "DB"
database_name = "thank-me-later-db-uat"
database_id = "21ac1c5d-d903-4ee6-9b99-e0d35021c0ce"

[env.prd]
name = "thank-me-later-worker-prd"
workers_dev = false

[env.prd.vars]
APP_ENV = "prd"
ALLOWED_ORIGINS = "https://thankmelatercatering.com,https://www.thankmelatercatering.com,https://uat.thankmelatercatering.com,https://thank-me-later-worker-prd.etavcorp.workers.dev"

[env.prd.assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.prd.d1_databases]]
binding = "DB"
database_name = "thank-me-later-db-prd"
database_id = "5f67cdc8-1965-4910-b61e-52a4c976f110"

[build]
command = "npm install && npm run build"
